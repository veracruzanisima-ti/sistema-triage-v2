<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Sistema Triage{% endblock %}</title>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #ffffff; border-bottom: 1px solid #dfe4ec; }
    nav, main { width: min(1040px, calc(100% - 32px)); margin: 0 auto; }
    nav { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    nav a { color: inherit; text-decoration: none; font-weight: 700; }
    main { padding: 32px 0 56px; }
    h1 { margin-top: 0; font-size: clamp(1.7rem, 4vw, 2.4rem); }
    h2 { margin-top: 0; }
    h3 { margin-top: 0; }
    p, li { line-height: 1.55; }
    .barra { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 24px; }
    .tarjeta { background: #ffffff; border: 1px solid #dfe4ec; border-radius: 14px; padding: 20px; margin-bottom: 14px; }
    .boton { display: inline-block; border: 0; border-radius: 10px; padding: 11px 16px; background: #172033; color: white; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    .boton:disabled { opacity: .5; cursor: not-allowed; }
    .boton-secundario { background: #e9edf5; color: #172033; }
    .boton-peligro { background: #fff0f0; color: #8d1b1b; border: 1px solid #efc1c1; }
    .boton-texto { background: transparent; color: #485367; padding: 7px 9px; }
    .boton-excluir { background: #f9e8e8; color: #713737; border: 1px solid #e2bcbc; margin-top: 8px; }
    .grupo-botones { display: flex; flex-wrap: wrap; gap: 10px; }
    .usuario { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    input, textarea, select { width: 100%; padding: 12px; border: 1px solid #b8c0cf; border-radius: 9px; font: inherit; background: white; color: inherit; }
    input[type="checkbox"] { width: auto; }
    .ayuda { color: #5e687a; font-size: .95rem; }
    .error { color: #9f1d1d; background: #fff0f0; border: 1px solid #f0c5c5; border-radius: 9px; padding: 11px 13px; }
    .exito { color: #245d36; background: #eef9f1; border: 1px solid #bcdcc5; border-radius: 9px; padding: 11px 13px; }
    .aviso { color: #684c08; background: #fff8e7; border: 1px solid #ead397; border-radius: 9px; padding: 11px 13px; }
    .estado { display: inline-block; padding: 5px 9px; border: 1px solid transparent; border-radius: 999px; background: #eef1f6; color: #465166; font-size: .86rem; font-weight: 700; }
    .estado-recibido { background: #f1f3f6; border-color: #d8dde5; color: #515b6d; }
    .estado-analizado, .estado-en-proceso { background: #eef5ff; border-color: #c8dcf4; color: #285987; }
    .estado-revisado, .estado-finalizada { background: #eef9f1; border-color: #bcdcc5; color: #245d36; }
    .estado-error { background: #fff0f0; border-color: #f0c5c5; color: #9f1d1d; }
    .estado-pendiente-revision { background: #fff8e7; border-color: #ead397; color: #684c08; }
    .referencia { font-size: 1.08rem; font-weight: 700; }
    .vacio { text-align: center; padding: 42px 20px; }
    .acceso { width: min(460px, 100%); margin: 6vh auto 0; }
    .campo { margin-bottom: 18px; }
    .rejilla { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 18px; }
    .campo-ancho { grid-column: 1 / -1; }
    .partida { border-top: 1px solid #e1e5ec; padding: 20px 0 4px; }
    .partida:first-of-type { border-top: 0; }
    .partida[data-partida-indice] { margin: 14px 0; padding: 18px; border: 1px solid #dfe4ec; border-left: 4px solid #c5cedb; border-radius: 12px; background: #fafbfe; }
    .partida[data-partida-indice]:first-of-type { border-top: 1px solid #dfe4ec; }
    .partida[data-partida-indice] h3 { margin-bottom: 18px; }
    .partida-vacia { opacity: .88; }
    .partida.partida-restringida { margin: 14px 0; padding: 16px; border: 1px solid #edcdcd; border-left: 4px solid #c56a6a; border-radius: 12px; background: #fff9f9; }
    .partida.partida-restringida:first-of-type { border-top: 1px solid #edcdcd; }
    .partida.partida-excluida { margin: 14px 0; padding: 14px 16px; border: 1px solid #d8dde5; border-left: 4px solid #8993a3; border-radius: 12px; background: #f7f8fa; }
    .partida.partida-excluida:first-of-type { border-top: 1px solid #d8dde5; }
    .estado-partida-excluida { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .estado-partida-excluida[hidden], .contenido-partida[hidden] { display: none; }
    .estado-partida-excluida p { margin: 4px 0 0; }
    .resumen-exclusion { color: #4f5969; background: #f1f3f6; border: 1px solid #d8dde5; border-radius: 10px; padding: 11px 13px; }
    .alerta-restriccion-resumen, .alerta-restriccion { color: #713737; background: #fff5f5; border: 1px solid #edcdcd; border-radius: 10px; padding: 11px 13px; }
    .alerta-restriccion { margin: 0 0 16px; }
    .alerta-restriccion p { margin: 6px 0; }
    .alerta-restriccion-meta { color: #765858; font-size: .84rem; }
    .detalle-regla { margin: 8px 0; }
    .encabezado-partida { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .opcion { display: flex; align-items: flex-start; gap: 10px; font-weight: 600; }
    .zona-archivo { position: relative; display: flex; min-height: 170px; padding: 28px; border: 2px dashed #b8c0cf; border-radius: 14px; align-items: center; justify-content: center; flex-direction: column; gap: 10px; text-align: center; background: #fafbfe; transition: border-color .15s ease, background .15s ease; }
    .zona-archivo-activa { border-color: #172033; background: #eef2f9; }
    .archivo-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .selector-archivo { margin: 0; }
    .cola-archivos { display: grid; gap: 9px; margin: 14px 0; }
    .archivo-tarjeta { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 11px 12px; border: 1px solid #dfe4ec; border-radius: 10px; background: #ffffff; }
    .archivo-informacion { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .archivo-nombre { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .archivo-meta { font-size: .84rem; }
    .archivo-acciones { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .archivo-estado { display: inline-block; padding: 4px 8px; border-radius: 999px; background: #eef1f6; font-size: .8rem; font-weight: 700; }
    .archivo-estado-leyendo { background: #fff8e7; color: #684c08; }
    .archivo-estado-listo { background: #eef9f1; color: #245d36; }
    .archivo-estado-error { background: #fff0f0; color: #9f1d1d; }
    .archivo-estado-pausado { background: #fff4df; color: #76530b; }
    .archivo-quitar { width: 30px; height: 30px; padding: 0; border: 0; border-radius: 999px; background: #eef1f6; color: #485367; font: inherit; font-size: 1.2rem; line-height: 1; cursor: pointer; }
    .archivo-quitar:disabled { opacity: .5; cursor: not-allowed; }
    .indicador-lectura { display: flex; align-items: center; gap: 10px; margin: 14px 0; padding: 11px 13px; border: 1px solid #dfe4ec; border-radius: 10px; background: #fafbfe; }
    .indicador-lectura[hidden] { display: none; }
    .spinner { width: 18px; height: 18px; border: 2px solid #c9d0dc; border-top-color: #172033; border-radius: 50%; animation: girar .8s linear infinite; flex-shrink: 0; }
    .volver-arriba { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); z-index: 30; padding: 10px 14px; border: 1px solid #cfd6e2; border-radius: 999px; background: rgba(255, 255, 255, .96); color: #172033; font: inherit; font-size: .9rem; font-weight: 700; box-shadow: 0 6px 20px rgba(23, 32, 51, .14); cursor: pointer; }
    .volver-arriba:hover { background: #f3f5f9; }
    .volver-arriba:focus-visible { outline: 3px solid #9fb4d1; outline-offset: 2px; }
    .volver-arriba[hidden] { display: none; }
    @keyframes girar { to { transform: rotate(360deg); } }
    details { margin-top: 14px; }
    summary { cursor: pointer; font-weight: 700; }
    form { margin: 0; }
    @media (max-width: 680px) {
      nav { align-items: flex-start; padding: 14px 0; }
      .usuario { justify-content: flex-end; }
      .rejilla { grid-template-columns: 1fr; }
      .campo-ancho { grid-column: auto; }
      .zona-archivo { min-height: 150px; padding: 22px 16px; }
      .archivo-tarjeta { align-items: flex-start; }
      .archivo-acciones { flex-direction: column-reverse; align-items: flex-end; }
      .estado-partida-excluida { align-items: flex-start; flex-direction: column; }
      .volver-arriba { right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); padding: 9px 12px; }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      {% if usuario %}
        <a href="/cotizaciones">Sistema Triage</a>
        <div class="usuario">
          <span>{{ usuario.nombre }}</span>
          <a href="/cotizaciones/nueva">Nueva cotización</a>
          <form method="post" action="/salir">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button class="boton boton-texto" type="submit">Salir</button>
          </form>
        </div>
      {% else %}
        <strong>Sistema Triage</strong>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block contenido %}{% endblock %}
  </main>
  <button id="volver-arriba" class="volver-arriba" type="button" hidden aria-label="Volver al inicio de la página">↑ Volver arriba</button>
  <script>
    (() => {
      const boton = document.getElementById("volver-arriba");
      if (!boton) return;

      const reducirMovimiento = window.matchMedia("(prefers-reduced-motion: reduce)");
      const actualizarVisibilidad = () => {
        const paginaLarga = document.documentElement.scrollHeight > window.innerHeight * 1.35;
        const desplazamientoMinimo = Math.min(600, window.innerHeight * 0.7);
        boton.hidden = !paginaLarga || window.scrollY < desplazamientoMinimo;
      };

      boton.addEventListener("click", () => {
        window.scrollTo({
          top: 0,
          behavior: reducirMovimiento.matches ? "auto" : "smooth",
        });
      });
      window.addEventListener("scroll", actualizarVisibilidad, { passive: true });
      window.addEventListener("resize", actualizarVisibilidad);
      actualizarVisibilidad();
    })();
  </script>
</body>
</html>
