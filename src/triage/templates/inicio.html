<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titulo }}</title>
  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: light dark; }
    body { margin: 0; background: #f5f6f8; color: #18202a; }
    main { max-width: 860px; margin: 0 auto; padding: 64px 24px; }
    .tarjeta { background: white; border-radius: 18px; padding: 32px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    .acciones { display: grid; gap: 12px; margin-top: 28px; }
    button { font: inherit; padding: 14px 18px; border-radius: 12px; border: 0; cursor: pointer; }
    button[disabled] { cursor: not-allowed; opacity: .55; }
    .nota { margin-top: 22px; color: #5b6470; }
    @media (prefers-color-scheme: dark) {
      body { background: #11151a; color: #eef2f6; }
      .tarjeta { background: #1c2229; }
      .nota { color: #aeb7c2; }
    }
  </style>
</head>
<body>
  <main>
    <section class="tarjeta">
      <h1>Sistema Triage</h1>
      <p>Base inicial de la nueva aplicación de cotizaciones de Veracruzanísima.</p>
      <div class="acciones">
        <button type="button" disabled>Nueva cotización — siguiente etapa</button>
        <button type="button" disabled>En proceso — siguiente etapa</button>
        <button type="button" disabled>Finalizadas — siguiente etapa</button>
      </div>
      <p class="nota">Esta versión fundacional sólo valida que la aplicación web sea ejecutable. Aún no procesa documentos reales.</p>
    </section>
  </main>
</body>
</html>
