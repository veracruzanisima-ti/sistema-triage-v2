services:
  - type: web
    name: sistema-triage-v2-preview
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: bash scripts/iniciar_preview_render.sh
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-triage-v2-preview-db
          property: connectionString
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SESSION_MAX_AGE_SECONDS
        value: "43200"

databases:
  - name: sistema-triage-v2-preview-db
    plan: free
    databaseName: sistema_triage_v2_preview
    user: sistema_triage_v2_preview
    ipAllowList: []
