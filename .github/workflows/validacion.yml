name: Validación

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar proyecto
        run: pip install -e ".[dev]"

      - name: Revisar estilo y errores simples
        run: ruff check .

      - name: Validar scripts del preview
        run: |
          bash -n scripts/construir_preview_render.sh
          bash -n scripts/iniciar_preview_render.sh

      - name: Validar migraciones
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci_migracion.sqlite3
        run: alembic upgrade head

      - name: Ejecutar pruebas
        run: pytest -q
